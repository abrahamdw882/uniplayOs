<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>UniplayOS · native player</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #0a0a0a;
      --surface: #111;
      --border: #1f1f1f;
      --text: #e8e8e8;
      --muted: #777;
      --accent: #c8ff00;
      --ctrl-h: 48px;
    }

    html, body {
      height: 100%;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0.5rem;
    }

    #wrapper {
      width: 100%;
      max-width: 1200px;
      height: 100%;
      max-height: 900px;
      background: var(--bg);
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0,0,0,0.8);
      display: flex;
      flex-direction: column;
    }

    #stage {
      position: relative;
      width: 100%;
      background: #000;
      flex: 1;
      min-height: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      aspect-ratio: 16 / 9;
    }

    #stage video {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: contain;
      background: #000;
    }

    #stage #embed-frame {
      width: 100%;
      height: 100%;
      border: none;
      display: none;
      object-fit: contain;
    }

    #thumbnail {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: none;
      z-index: 1;
    }

    #thumbnail.visible { display: block; }

    #stage.paused #overlay { z-index: 2; }

    #loader {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      background: rgba(0, 0, 0, 0.6);
      backdrop-filter: blur(2px);
      z-index: 20;
      pointer-events: none;
    }
    #loader.active {
      display: flex;
    }

    .uniplayos-spinner {
      width: 64px;
      height: 64px;
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .uniplayos-spinner .ring {
      position: absolute;
      border-radius: 50%;
      border: 4px solid transparent;
      border-top-color: var(--accent);
      border-bottom-color: var(--accent);
      animation: spin 1.2s cubic-bezier(0.5, 0, 0.5, 1) infinite;
      will-change: transform;
    }

    .uniplayos-spinner .ring:nth-child(1) {
      width: 64px;
      height: 64px;
      animation-duration: 1.2s;
      border-width: 4px;
    }
    .uniplayos-spinner .ring:nth-child(2) {
      width: 44px;
      height: 44px;
      animation-duration: 0.9s;
      border-width: 3px;
      border-top-color: #fff;
      border-bottom-color: #fff;
    }
    .uniplayos-spinner .ring:nth-child(3) {
      width: 24px;
      height: 24px;
      animation-duration: 0.6s;
      border-width: 3px;
      border-top-color: var(--accent);
      border-bottom-color: var(--accent);
    }

    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    #overlay {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: none;
      z-index: 10;
    }

    #play-big {
      width: 70px;
      height: 70px;
      border: 2px solid var(--accent);
      color: var(--accent);
      background: rgba(0,0,0,0.5);
      backdrop-filter: blur(4px);
      cursor: pointer;
      font-size: 1.8rem;
      display: flex;
      align-items: center;
      justify-content: center;
      pointer-events: all;
      border-radius: 50%;
      opacity: 0;
      transition: opacity 0.2s, transform 0.2s;
      transform: scale(0.9);
    }

    #stage.paused #play-big {
      opacity: 1;
      transform: scale(1);
    }

    #controls {
      background: var(--surface);
      border-top: 1px solid var(--border);
      padding: 0.5rem 0.75rem 0.6rem;
      display: flex;
      flex-direction: column;
      gap: 0.4rem;
      flex-shrink: 0;
    }

    #progress-wrap {
      position: relative;
      height: 5px;
      background: var(--border);
      cursor: pointer;
      border-radius: 4px;
      transition: height 0.1s;
      display: flex;
      align-items: center;
    }

    #progress-wrap:hover {
      height: 7px;
    }

    #progress-wrap input[type="range"] {
      position: absolute;
      width: 100%;
      height: 100%;
      -webkit-appearance: none;
      appearance: none;
      background: transparent;
      cursor: pointer;
      margin: 0;
      padding: 0;
      top: 0;
      left: 0;
      z-index: 2;
    }

    #progress-wrap input[type="range"]::-webkit-slider-thumb {
      -webkit-appearance: none;
      appearance: none;
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      box-shadow: 0 0 10px rgba(200, 255, 0, 0.3);
      transition: transform 0.15s;
      margin-top: -4.5px;
    }

    #progress-wrap input[type="range"]::-webkit-slider-thumb:hover {
      transform: scale(1.2);
    }

    #progress-wrap input[type="range"]::-moz-range-thumb {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--accent);
      cursor: pointer;
      border: none;
      box-shadow: 0 0 10px rgba(200, 255, 0, 0.3);
    }

    #progress-wrap input[type="range"]::-moz-range-thumb:hover {
      transform: scale(1.2);
    }

    #progress-wrap input[type="range"]::-webkit-slider-runnable-track {
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
    }

    #progress-wrap input[type="range"]::-moz-range-track {
      width: 100%;
      height: 100%;
      background: transparent;
      border: none;
    }

    #progress-fill {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      background: var(--accent);
      width: 0%;
      pointer-events: none;
      border-radius: 4px;
      z-index: 1;
    }

    #ctrl-row {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      height: var(--ctrl-h);
      flex-wrap: nowrap;
      width: 100%;
    }

    button {
      background: none;
      border: none;
      color: var(--text);
      cursor: pointer;
      font-family: inherit;
      font-size: 1rem;
      padding: 0.25rem 0.4rem;
      letter-spacing: 0.03em;
      transition: color 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      flex-shrink: 0;
    }
    button:hover { color: var(--accent); }
    button:focus-visible { outline: 1px solid var(--accent); }

    #time {
      font-size: 0.8rem;
      color: var(--muted);
      white-space: nowrap;
      font-variant-numeric: tabular-nums;
      min-width: 90px;
      flex-shrink: 0;
    }

    .spacer {
      flex: 1;
      min-width: 4px;
    }

    #vol {
      width: 60px;
      accent-color: var(--accent);
      background: var(--border);
      border-radius: 4px;
      height: 4px;
      cursor: pointer;
      flex-shrink: 0;
    }

    #debug-bar {
      display: none;
      padding: 0.5rem 0.75rem 0.75rem;
      background: var(--surface);
      border-top: 1px solid var(--border);
      flex-wrap: wrap;
      gap: 0.5rem;
      flex-shrink: 0;
    }

    #debug-bar.visible {
      display: flex;
    }

    #debug-bar input {
      flex: 1;
      background: var(--bg);
      border: 1px solid var(--border);
      color: var(--text);
      font-family: inherit;
      font-size: 0.8rem;
      padding: 0.5rem 0.75rem;
      outline: none;
      border-radius: 6px;
      min-width: 150px;
    }

    #debug-bar input:focus {
      border-color: var(--accent);
    }

    #debug-bar button {
      border: 1px solid var(--accent);
      color: var(--accent);
      padding: 0.5rem 1.2rem;
      font-size: 0.8rem;
      letter-spacing: 0.05em;
      border-radius: 6px;
      background: transparent;
      cursor: pointer;
      transition: 0.15s;
      font-family: inherit;
    }

    #debug-bar button:hover {
      background: var(--accent);
      color: var(--bg);
    }

    #status {
      font-size: 0.72rem;
      color: var(--muted);
      padding: 0.25rem 0.75rem 0.5rem;
      background: var(--surface);
      min-height: 1.6rem;
      border-top: 1px solid var(--border);
      font-family: monospace;
      display: none;
      flex-shrink: 0;
    }

    #status.visible {
      display: block;
    }

    #resume-toast {
      position: absolute;
      bottom: 4.2rem;
      left: 50%;
      transform: translateX(-50%) translateY(8px);
      background: var(--surface);
      border: 1px solid var(--accent);
      color: var(--fg, #fff);
      font-size: 0.78rem;
      padding: 0.4rem 0.9rem;
      border-radius: 999px;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.25s ease, transform 0.25s ease;
      white-space: nowrap;
      z-index: 5;
    }

    #resume-toast.visible {
      opacity: 1;
      transform: translateX(-50%) translateY(0);
    }

    #stage.fullscreen {
      position: fixed;
      inset: 0;
      width: 100vw;
      height: 100vh;
      max-width: 100vw;
      max-height: 100vh;
      background: #000;
      z-index: 9999;
      aspect-ratio: auto !important;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0;
      border-radius: 0;
    }

    #stage.fullscreen video {
      object-fit: contain;
      width: 100vw;
      height: 100vh;
    }

    #stage.fullscreen #controls {
      position: absolute;
      bottom: 0;
      left: 0;
      right: 0;
      background: rgba(0,0,0,0.7);
      backdrop-filter: blur(8px);
      border-top: 1px solid rgba(255,255,255,0.1);
      width: 100%;
    }

    #stage.fullscreen #ctrl-row {
      width: 100%;
      flex-wrap: nowrap;
      gap: 0.5rem;
    }

    #stage.fullscreen #debug-bar,
    #stage.fullscreen #status {
      display: none !important;
    }

    @media (min-width: 1024px) {
      #wrapper {
        max-height: 900px;
        height: 90vh;
      }
      #stage {
        aspect-ratio: 16 / 9;
        flex: 1;
        min-height: 0;
      }
      #ctrl-row {
        gap: 0.75rem;
      }
      button {
        font-size: 1.1rem;
        padding: 0.3rem 0.6rem;
      }
      #time {
        font-size: 0.9rem;
        min-width: 100px;
      }
      #vol {
        width: 80px;
      }
      #play-big {
        width: 80px;
        height: 80px;
        font-size: 2rem;
      }
    }

    @media (max-width: 768px) {
      #wrapper {
        max-height: 100vh;
        height: 100%;
        border-radius: 0;
      }
      #stage {
        aspect-ratio: 16 / 9;
      }
    }

    @media (max-width: 600px) {
      #ctrl-row { gap: 0.3rem; }
      #vol { width: 45px; }
      #time { font-size: 0.7rem; min-width: 75px; }
      #play-big { width: 56px; height: 56px; font-size: 1.4rem; }
      #progress-wrap input[type="range"]::-webkit-slider-thumb {
        width: 16px;
        height: 16px;
        margin-top: -5.5px;
      }
      #progress-wrap input[type="range"]::-moz-range-thumb {
        width: 16px;
        height: 16px;
      }
      #debug-bar {
        padding: 0.4rem 0.5rem 0.6rem;
      }
      #debug-bar input {
        font-size: 0.7rem;
        padding: 0.4rem 0.6rem;
      }
      #debug-bar button {
        padding: 0.4rem 0.8rem;
        font-size: 0.7rem;
      }
    }

    @media (max-width: 480px) {
      #progress-wrap input[type="range"]::-webkit-slider-thumb {
        width: 14px;
        height: 14px;
        margin-top: -4.5px;
      }
      #progress-wrap input[type="range"]::-moz-range-thumb {
        width: 14px;
        height: 14px;
      }
    }
    
    @media (orientation: landscape) and (max-height: 500px) {
      #stage.fullscreen #ctrl-row {
        gap: 0.2rem;
      }
      #stage.fullscreen #time {
        min-width: 60px;
        font-size: 0.65rem;
      }
      #stage.fullscreen #vol {
        width: 40px;
      }
      #stage.fullscreen button {
        font-size: 0.8rem;
        padding: 0.2rem 0.3rem;
      }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition: none !important; }
    }
  </style>
</head>
<body>

<div id="wrapper">
  <div id="stage" class="paused">
    <video id="video" playsinline></video>
    <img id="thumbnail" alt="">
    <iframe id="embed-frame" allowfullscreen allow="autoplay"></iframe>

    <div id="loader">
      <div class="uniplayos-spinner">
        <div class="ring"></div>
        <div class="ring"></div>
        <div class="ring"></div>
      </div>
    </div>

    <div id="overlay">
      <button id="play-big" aria-label="Play"><i class="fa-solid fa-play"></i></button>
    </div>

    <div id="resume-toast"></div>
  </div>

  <div id="controls">
    <div id="progress-wrap" role="slider" aria-label="Seek" tabindex="0">
      <div id="progress-fill"></div>
      <input type="range" id="seek-slider" min="0" max="100" value="0" step="0.01" aria-label="Seek">
    </div>
    <div id="ctrl-row">
      <button id="btn-play" aria-label="Play/Pause"><i class="fa-solid fa-play"></i></button>
      <button id="btn-rewind" aria-label="Rewind 10s"><i class="fa-solid fa-backward-step"></i></button>
      <button id="btn-forward" aria-label="Forward 10s"><i class="fa-solid fa-forward-step"></i></button>
      <span id="time">0:00 / 0:00</span>
      
      <div class="spacer"></div>
      
      <button id="btn-mute" aria-label="Mute"><i class="fa-solid fa-volume-high"></i></button>
      <input id="vol" type="range" min="0" max="1" step="0.02" value="1" aria-label="Volume">
      <button id="btn-fs" aria-label="Fullscreen"><i class="fa-solid fa-expand"></i></button>
    </div>
  </div>

  <div id="debug-bar">
    <input id="url-input" type="url" placeholder="Paste video URL (MP4, HLS, DASH, YouTube…)" spellcheck="false">
    <button id="url-load">Load</button>
  </div>
  <div id="status">Ready</div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/hls.js/1.5.7/hls.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dashjs/4.7.4/dash.all.min.js"></script>
<script src="/js/utils/utils.js"></script>
<script src="/js/utils/resolver.js"></script>
<script src="/js/utils/api.js"></script>
<script src="/js/utils/storage.js"></script>

<script>
  (function() {
    const video = document.getElementById('video');
    const stage = document.getElementById('stage');
    const embedFrame  = document.getElementById('embed-frame');
    const thumbnail   = document.getElementById('thumbnail');
    const btnPlay = document.getElementById('btn-play');
    const btnRewind = document.getElementById('btn-rewind');
    const btnForward = document.getElementById('btn-forward');
    const playBig = document.getElementById('play-big');
    const btnMute = document.getElementById('btn-mute');
    const btnFs = document.getElementById('btn-fs');
    const progress = document.getElementById('progress-fill');
    const progWrap = document.getElementById('progress-wrap');
    const seekSlider = document.getElementById('seek-slider');
    const timeEl = document.getElementById('time');
    const volSlider = document.getElementById('vol');
    const urlInput = document.getElementById('url-input');
    const urlLoad = document.getElementById('url-load');
    const status = document.getElementById('status');
    const debugBar = document.getElementById('debug-bar');
    const loader = document.getElementById('loader');

    let hlsInstance = null;
    let dashInstance = null;
    let isReadySent = false;
    let isSeeking = false;
    let isDebugMode = false;
    let loadTimeout = null;
    let waitingTimeout = null;

    const HISTORY_KEY = 'history';
    const HISTORY_MAX_ENTRIES = 50;
    const RESUME_MIN_POSITION = 5;
    const RESUME_END_BUFFER = 15;
    const HISTORY_SAVE_INTERVAL_MS = 5000;

    const resumeToast = document.getElementById('resume-toast');
    let currentSourceUrl = null;
    let lastHistorySaveAt = 0;
    let resumeToastTimer = null;

    function getHistory() {
      return Storage.get(HISTORY_KEY, []);
    }

    function getHistoryEntry(url) {
      return getHistory().find((entry) => entry.url === url) || null;
    }

    function saveHistoryEntry(url, position, duration) {
      if (!url || !duration || !isFinite(duration)) return;
      const list = getHistory().filter((entry) => entry.url !== url);
      list.unshift({ url, position, duration, updatedAt: Date.now() });
      Storage.set(HISTORY_KEY, list.slice(0, HISTORY_MAX_ENTRIES));
    }

    function removeHistoryEntry(url) {
      Storage.set(HISTORY_KEY, getHistory().filter((entry) => entry.url !== url));
    }

    function showResumeToast(position) {
      if (!resumeToast) return;
      resumeToast.textContent = `Resumed from ${Utils.formatTime(position)}`;
      resumeToast.classList.add('visible');
      if (resumeToastTimer) clearTimeout(resumeToastTimer);
      resumeToastTimer = setTimeout(() => resumeToast.classList.remove('visible'), 2500);
    }

    function maybeResume(url) {
      const entry = getHistoryEntry(url);
      if (!entry) return;
      if (entry.position < RESUME_MIN_POSITION) return;
      if (entry.duration && entry.position > entry.duration - RESUME_END_BUFFER) {
        removeHistoryEntry(url);
        return;
      }
      video.currentTime = entry.position;
      showResumeToast(entry.position);
    }

    function persistProgress(force = false) {
      if (!currentSourceUrl || !video.duration || !isFinite(video.duration)) return;
      const now = Date.now();
      if (!force && now - lastHistorySaveAt < HISTORY_SAVE_INTERVAL_MS) return;
      lastHistorySaveAt = now;
      saveHistoryEntry(currentSourceUrl, video.currentTime, video.duration);
    }

    function showLoader(show) {
      loader.classList.toggle('active', show);
    }

    function setStatus(msg) {
      status.textContent = msg;
      status.classList.toggle('visible', !!msg && isDebugMode);
    }

    function sendEmbedEvent(action, payload = {}) {
      window.parent.postMessage({ type: 'uniplayos', action, ...payload }, '*');
    }

    function sendReadyIfNeeded() {
      if (!isReadySent) {
        isReadySent = true;
        sendEmbedEvent('ready');
      }
    }

    function updateAspectRatio() {
      if (!video.videoWidth || !video.videoHeight) return;
      const w = video.videoWidth;
      const h = video.videoHeight;
      stage.style.aspectRatio = `${w} / ${h}`;
    }

    function destroyInstances() {
      if (hlsInstance) { hlsInstance.destroy(); hlsInstance = null; }
      if (dashInstance) { dashInstance.reset(); dashInstance = null; }
    }

    function showVideo() {
      video.style.display = 'block';
      embedFrame.style.display = 'none';
    }
    function showEmbed() {
      video.style.display = 'none';
      embedFrame.style.display = 'block';
    }

    function setThumbnail(url) {
      if (!url) { thumbnail.classList.remove('visible'); thumbnail.src = ''; return; }
      thumbnail.src = url;
      thumbnail.classList.add('visible');
    }

    function clearThumbnail() {
      thumbnail.classList.remove('visible');
    }

    function safePlay() {
      const p = video.play();
      if (p !== undefined) p.catch(() => {});
    }

    function getEmbedUrl(url) {
      if (Utils.isYouTube(url)) {
        const match = url.match(/(?:v=|youtu\.be\/|shorts\/)([a-zA-Z0-9_-]{11})/);
        return match ? `https://www.youtube.com/embed/${match[1]}?autoplay=1&enablejsapi=1` : url;
      }
      if (Utils.isVimeo(url)) {
        const match
